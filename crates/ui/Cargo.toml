[package]
name = "foundry_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
foundry_core.workspace = true
foundry_content.workspace = true
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
# Only for `mock`: reading the data files and the extra mock data.
ron.workspace = true
serde.workspace = true

[dev-dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot"] }
